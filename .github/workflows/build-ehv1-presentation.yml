name: Build EHV-1 conference presentation

on:
  push:
    paths:
      - 'presentation/.build_parts/**'
      - '.github/workflows/build-ehv1-presentation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pptx:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PptxGenJS
        run: npm install --no-save pptxgenjs@4.0.0

      - name: Assemble presentation source
        run: cat presentation/.build_parts/part*.txt > presentation/build_ehv1_master.js

      - name: Build PowerPoint
        run: node presentation/build_ehv1_master.js

      - name: Commit generated deck
        run: |
          rm -rf presentation/.build_parts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add presentation/build_ehv1_master.js presentation/EHV1_dynamic_transcriptome_conference_master.pptx presentation/.build_parts
          git diff --cached --quiet && exit 0
          git commit -m 'Add generated EHV-1 conference presentation [skip ci]'
          git push
